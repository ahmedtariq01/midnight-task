groups:
  - name: midnight-preprod
    rules:
      - alert: MidnightBlockImportStalled
        expr: |
          (
            delta(substrate_block_height{job="midnight-node",chain="midnight_preprod",status="best"}[10m]) <= 0
            and count_over_time(substrate_block_height{job="midnight-node",chain="midnight_preprod",status="best"}[10m]) >= 18
          )
          and on (job, instance) (up{job="midnight-node"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Midnight PreProd block import has stalled"
          description: "Best block height has not advanced. Compare with the public PreProd tip and inspect node logs, disk, and peers."

      - alert: MidnightPeerCountLow
        expr: |
          (substrate_sub_libp2p_peers_count{job="midnight-node",chain="midnight_preprod"} < 3)
          and on (job, instance) (up{job="midnight-node"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Midnight PreProd has fewer than three peers"
          description: "Check bootnodes, peer discovery, and P2P connectivity."

      - alert: MidnightTelemetryUnavailable
        expr: |
          (up{job="midnight-node"} == 0)
          or absent(up{job="midnight-node",instance="127.0.0.1:9615"})
          or (
            (up{job="midnight-node"} == 1)
            unless on (job, instance) (
              substrate_block_height{job="midnight-node",chain="midnight_preprod",status="best"}
              and on (job, instance) substrate_sub_libp2p_peers_count{job="midnight-node",chain="midnight_preprod"}
            )
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Midnight PreProd telemetry is unavailable"
          description: "Check the scrape target, midnight-node.service, and the expected metrics at 127.0.0.1:9615."
