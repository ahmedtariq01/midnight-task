apiVersion: 1

datasources:
  - name: PreProd Prometheus
    uid: preprod-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      prometheusType: Prometheus
      manageAlerts: true
